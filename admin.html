<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realfarm R幣後台管理</title>
    
    <!-- SortableJS 拖曳套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <!-- Firebase SDK (9.x 相容版) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            color: #333;
            max-width: 650px;
            margin: 0 auto;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { text-align: center; color: #2c3e50; font-size: 20px; }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        h2 { font-size: 15px; color: #4a5568; margin-top: 0; border-bottom: 2px solid #edf2f7; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input, textarea, button { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        input { flex: 1; min-width: 0; }
        textarea { resize: vertical; height: 160px; font-family: monospace; width: 100%; }
        button { background: #3182ce; color: white; border: none; cursor: pointer; font-weight: bold; white-space: nowrap; }
        button.danger { background: #e53e3e; }
        button.secondary { background: #718096; font-size: 12px; padding: 6px 14px; width: 100%; }
        button.success { background: #38a169; }
        
        .editable-panel { display: none; }
        
        .add-account-panel {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 12px;
            display: none;
        }
        .add-account-title { font-size: 13px; font-weight: bold; color: #4a5568; margin-bottom: 8px; }
        .add-account-row { display: flex; gap: 8px; align-items: center; }

        .item-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 38px; align-items: center; }
        
        .badge {
            background: #edf2f7;
            padding: 6px 10px;
            border-radius: 16px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #cbd5e0;
            cursor: grab;
        }
        .badge:active { cursor: grabbing; }
        .badge span { cursor: pointer; color: #e53e3e; font-weight: bold; margin-left: 2px; }

        .sortable-ghost { opacity: 0.3; background: #cbd5e0 !important; }
        .sortable-drag { opacity: 0.9; transform: scale(1.05); }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px; text-align: center; }
        th { background: #f7fafc; cursor: pointer; user-select: none; }
        th:hover { background: #edf2f7; }

        .coin-input { 
            width: 70px; 
            text-align: center; 
            padding: 4px; 
            border: 1px solid transparent; 
            background: transparent; 
            font-size: 13px; 
            font-weight: bold; 
            -moz-appearance: textfield; 
        }
        .coin-input::-webkit-outer-spin-button,
        .coin-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .coin-input:focus { border-color: #3182ce; background: #fff; outline: none; border-radius: 4px; }
        .back-link { display: block; text-align: center; margin-bottom: 15px; color: #3182ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<a href="index.html" class="back-link">⬅️ 返回遊戲主畫面</a>
<h1>⚙️ 後台管理中心</h1>

<div style="margin-bottom: 15px;">
    <button class="secondary" onclick="toggleEditMode()" id="editModeBtnTop">🔓 開啟新增/刪除與匯入匯出模式</button>
</div>

<!-- 1. 帳號 R 幣數量維護 -->
<div class="card">
    <h2>💎 帳號R幣數量維護</h2>

    <div class="add-account-panel" id="addAccountPanel">
        <div class="add-account-title">✨ 新增新帳號</div>
        <div class="add-account-row">
            <input type="text" id="newAccNameInput" placeholder="帳號代號 (例: 38)">
            <input type="number" inputmode="numeric" id="newAccCoinInput" placeholder="初始金幣" style="width: 110px; flex: 0 0 110px;">
            <button onclick="addNewAccount()">確認新增</button>
        </div>
    </div>

    <div style="font-size: 12px; color: #718096; margin-bottom: 8px; margin-top: 5px;">
        💡 <b>點擊即自動跳出純數字鍵盤並全選</b>：點入金幣欄位後可直接輸入新數字，跨群組會自動移至新群組尾端。點擊表頭可切換排序！
    </div>
    <div id="coinTableArea">載入中...</div>
</div>

<!-- 2. IOS 帳號管理 -->
<div class="card">
    <h2>🍏 IOS 帳號管理 (手動清單)</h2>
    <div class="input-group editable-panel" id="iosInputPanel">
        <input type="text" id="newIosInput" placeholder="輸入IOS帳號 (例: 雲)">
        <button onclick="addIosAccount()">新增IOS帳號</button>
    </div>
    <div class="item-list" id="iosListArea">載入中...</div>
</div>

<!-- 3. 裝置清單管理 -->
<div class="card">
    <h2>📱 裝置清單管理 (可直接拖曳調整順序)</h2>
    <div class="input-group editable-panel" id="deviceInputPanel">
        <input type="text" id="newDeviceInput" placeholder="輸入新裝置名稱 (例: Pro)">
        <button onclick="addDevice()">新增裝置</button>
    </div>
    <div class="item-list" id="deviceListArea">載入中...</div>
</div>

<!-- 4. 匯入與匯出專區 -->
<div class="card editable-panel" id="syncPanel" style="background: #f0fff4; border: 1px solid #c6f6d5;">
    <h2 style="color: #22543d; border-bottom-color: #9ae6b4;">📥 匯入與匯出設定文字</h2>
    <div style="font-size: 12px; color: #2f855a; margin-bottom: 8px;">
        你可以點擊「匯出目前設定」將現有清單轉成文字備份，或將文字貼上後點擊「執行文字匯入」更新雲端：
    </div>
    <textarea id="importTextInput" placeholder="[裝置]&#10;C3, Realme&#10;&#10;[IOS]&#10;寶, 睡&#10;&#10;[R少]&#10;31:0"></textarea>
    <div style="display: flex; justify-content: space-between; margin-top: 8px;">
        <button class="secondary" style="width: auto;" onclick="exportToText()">📤 匯出目前設定為文字</button>
        <button class="success" onclick="importFromText()">⚡ 執行文字匯入</button>
    </div>
</div>

<!-- 最下方的第二個切換按鈕 -->
<div style="margin-top: 15px; margin-bottom: 25px;">
    <button class="secondary" onclick="toggleEditMode()" id="editModeBtnBottom">🔓 開啟新增/刪除與匯入匯出模式</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC-5eJaWoM9yQfOtkbjEkm922KQ1Zpbs1A",
        authDomain: "realfarm-todolist.firebaseapp.com",
        databaseURL: "https://realfarm-todolist-default-rtdb.firebaseio.com",
        projectId: "realfarm-todolist",
        storageBucket: "realfarm-todolist.firebasestorage.app",
        messagingSenderId: "93416320476",
        appId: "1:93416320476:web:ca4b13550e5771cf1ff319"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref("game_tracker_v5");

    let cloudData = null;
    let showEditMode = false; 
    let currentSortField = 'name';  
    let sortAscending = true;     
    let deviceSortableInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        gameRef.on('value', (snapshot) => {
            cloudData = snapshot.val();
            
            if (!cloudData) {
                cloudData = { devices: [], groups: { 'R少': [], 'R中': [], 'R多': [], 'IOS': [] }, coins: {} };
            }

            if (!cloudData.devices) cloudData.devices = [];
            if (!cloudData.groups) cloudData.groups = {};
            if (!cloudData.coins) cloudData.coins = {};

            renderAdminUI();
        });
    });

    function saveToCloud() {
        gameRef.set(cloudData);
    }

    function exportToText() {
        if (!cloudData) return;
        let textLines = [];

        textLines.push('[裝置]');
        textLines.push((cloudData.devices || []).join(', '));
        textLines.push('');

        textLines.push('[IOS]');
        let iosList = (cloudData.groups && cloudData.groups['IOS']) ? cloudData.groups['IOS'] : [];
        textLines.push(iosList.join(', '));
        textLines.push('');

        ['R少', 'R中', 'R多'].forEach(gName => {
            textLines.push(`[${gName}]`);
            let members = (cloudData.groups && cloudData.groups[gName]) ? cloudData.groups[gName] : [];
            let formattedMembers = members.map(acc => {
                let coin = (cloudData.coins && cloudData.coins[acc] !== undefined) ? cloudData.coins[acc] : 0;
                return `${acc}:${coin}`;
            });
            textLines.push(formattedMembers.join(', '));
            textLines.push('');
        });

        document.getElementById('importTextInput').value = textLines.join('\n').trim();
        alert('📤 已成功將目前設定匯出至上方文字框！');
    }

    function importFromText() {
        const text = document.getElementById('importTextInput').value.trim();
        if (!text) {
            alert('請先貼上要匯入的文字！');
            return;
        }

        if (!confirm('確定要執行匯入嗎？這將會更新並覆蓋目前的裝置與群組清單。')) return;

        let newDevices = [];
        let newGroups = { 'R少': [], 'R中': [], 'R多': [], 'IOS': [] };
        let newCoins = cloudData.coins || {};

        let currentSection = '';
        const lines = text.split('\n');

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            if (line.startsWith('[') && line.endsWith(']')) {
                currentSection = line.substring(1, line.length - 1).trim();
                return;
            }

            let items = line.split(/[,，]/).map(i => i.trim()).filter(i => i !== '');

            if (currentSection === '裝置') {
                newDevices.push(...items);
            } else if (currentSection === 'IOS') {
                if (!newGroups['IOS']) newGroups['IOS'] = [];
                newGroups['IOS'].push(...items);
            } else if (['R少', 'R中', 'R多'].includes(currentSection)) {
                if (!newGroups[currentSection]) newGroups[currentSection] = [];
                items.forEach(item => {
                    let parts = item.split(':');
                    let accName = parts[0].trim();
                    if (accName) {
                        newGroups[currentSection].push(accName);
                        if (parts.length > 1) {
                            let coinVal = Number(parts[1].trim());
                            if (!isNaN(coinVal)) newCoins[accName] = coinVal;
                        }
                    }
                });
            }
        });

        cloudData.devices = newDevices;
        cloudData.groups = newGroups;
        cloudData.coins = newCoins;

        saveToCloud();
        alert('🎉 成功匯入並更新雲端資料！');
        document.getElementById('importTextInput').value = '';
    }

    function toggleEditMode() {
        showEditMode = !showEditMode;
        const btnTop = document.getElementById('editModeBtnTop');
        const btnBottom = document.getElementById('editModeBtnBottom');
        const syncPanel = document.getElementById('syncPanel');
        const devicePanel = document.getElementById('deviceInputPanel');
        const iosPanel = document.getElementById('iosInputPanel');
        const addPanel = document.getElementById('addAccountPanel');
        
        let btnText = showEditMode ? '🔒 關閉編輯與匯入匯出模式' : '🔓 開啟新增/刪除與匯入匯出模式';
        let btnBg = showEditMode ? '#e53e3e' : '#718096';

        btnTop.innerText = btnText;
        btnTop.style.background = btnBg;
        btnBottom.innerText = btnText;
        btnBottom.style.background = btnBg;

        if (showEditMode) {
            syncPanel.style.display = 'block';
            devicePanel.style.display = 'flex';
            iosPanel.style.display = 'flex';
            addPanel.style.display = 'block';
        } else {
            syncPanel.style.display = 'none';
            devicePanel.style.display = 'none';
            iosPanel.style.display = 'none';
            addPanel.style.display = 'none';
        }
        renderAdminUI();
    }

    function renderAdminUI() {
        if (!cloudData) return;

        const devArea = document.getElementById('deviceListArea');
        devArea.innerHTML = '';
        if (deviceSortableInstance) {
            deviceSortableInstance.destroy();
            deviceSortableInstance = null;
        }

        const devices = cloudData.devices || [];
        if (devices.length === 0) {
            devArea.innerHTML = '<span style="color:#a0aec0; font-size:12px;">目前沒有裝置，請開啟編輯模式以文字匯入或新增</span>';
        } else {
            devices.forEach((dev, idx) => {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.dataset.name = dev;
                let deleteBtnHtml = showEditMode ? ` <span onclick="removeDevice(${idx})">&times;</span>` : '';
                badge.innerHTML = `${dev}${deleteBtnHtml}`;
                devArea.appendChild(badge);
            });

            deviceSortableInstance = new Sortable(devArea, {
                animation: 150,
                delay: 150,
                delayOnTouchOnly: true,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: function () {
                    syncDevicesFromDOM();
                }
            });
        }

        const iosArea = document.getElementById('iosListArea');
        iosArea.innerHTML = '';
        const iosList = (cloudData.groups && cloudData.groups['IOS']) ? cloudData.groups['IOS'] : [];
        if (iosList.length === 0) {
            iosArea.innerHTML = '<span style="color:#a0aec0; font-size:12px;">目前沒有 IOS 帳號</span>';
        } else {
            iosList.forEach((acc, idx) => {
                const badge = document.createElement('div');
                badge.className = 'badge';
                let deleteBtnHtml = showEditMode ? ` <span onclick="removeIos(${idx})">&times;</span>` : '';
                badge.innerHTML = `${acc}${deleteBtnHtml}`;
                iosArea.appendChild(badge);
            });
        }

        let allAccounts = [];
        ['R少', 'R中', 'R多'].forEach(gName => {
            if (cloudData.groups && cloudData.groups[gName]) {
                cloudData.groups[gName].forEach(acc => {
                    let coin = (cloudData.coins && cloudData.coins[acc] !== undefined) ? cloudData.coins[acc] : '';
                    allAccounts.push({ name: acc, group: gName, coin: coin });
                });
            }
        });

        if (currentSortField) {
            allAccounts.sort((a, b) => {
                let valA = a[currentSortField];
                let valB = b[currentSortField];

                if (currentSortField === 'name') {
                    let numA = Number(valA);
                    let numB = Number(valB);
                    if (!isNaN(numA) && !isNaN(numB)) {
                        return sortAscending ? numA - numB : numB - numA;
                    }
                }

                if (typeof valA === 'string') {
                    return sortAscending ? valA.localeCompare(valB, 'zh-Hant') : valB.localeCompare(valA, 'zh-Hant');
                } else {
                    return sortAscending ? valA - valB : valB - valA;
                }
            });
        }

        const coinArea = document.getElementById('coinTableArea');
        let html = `<table><thead><tr>
            <th onclick="sortTable('group')">群組 ↕</th>
            <th onclick="sortTable('name')">帳號 ↕</th>
            <th onclick="sortTable('coin')">目前金幣 (點擊直接輸入) ↕</th>`;
        
        if (showEditMode) html += `<th>操作</th>`;
        html += `</tr></thead><tbody>`;

        if (allAccounts.length === 0) {
            html += `<tr><td colspan="${showEditMode ? 4 : 3}" style="color:#a0aec0; padding:15px;">目前沒有 R 幣帳號</td></tr>`;
        } else {
            allAccounts.forEach(item => {
                html += `<tr>
                    <td><span style="background:#edf2f7; padding:2px 6px; border-radius:4px; font-size:11px;">${item.group}</span></td>
                    <td><b>${item.name}</b></td>
                    <td><input type="number" inputmode="numeric" class="coin-input" value="${item.coin}" placeholder="-" 
                        onfocus="this.select()" 
                        onchange="updateCoinDirectly('${item.name}', this.value)"></td>`;
                
                if (showEditMode) {
                    html += `<td><button class="danger" style="padding:2px 6px; font-size:11px;" onclick="removeRspAcc('${item.name}')">刪除</button></td>`;
                }
                html += `</tr>`;
            });
        }
        html += `</tbody></table>`;
        coinArea.innerHTML = html;
    }

    function syncDevicesFromDOM() {
        const newDevices = [];
        document.querySelectorAll('#deviceListArea .badge').forEach(badge => {
            newDevices.push(badge.dataset.name);
        });
        cloudData.devices = newDevices;
        saveToCloud();
    }

    function sortTable(field) {
        if (currentSortField === field) {
            sortAscending = !sortAscending;
        } else {
            currentSortField = field;
            sortAscending = true;
        }
        renderAdminUI();
    }

    function updateCoinDirectly(accName, coinVal) {
        if (coinVal === '') return;
        const coin = Number(coinVal);

        let targetGroup = 'R少';
        if (coin < 200) targetGroup = 'R少';
        else if (coin < 300) targetGroup = 'R中';
        else targetGroup = 'R多';

        let oldGroup = null;
        ['R少', 'R中', 'R多'].forEach(g => {
            if (cloudData.groups[g] && cloudData.groups[g].includes(accName)) {
                oldGroup = g;
            }
        });

        if (oldGroup !== targetGroup) {
            if (oldGroup) {
                const idx = cloudData.groups[oldGroup].indexOf(accName);
                if (idx > -1) cloudData.groups[oldGroup].splice(idx, 1);
            }
            if (!cloudData.groups[targetGroup]) cloudData.groups[targetGroup] = [];
            cloudData.groups[targetGroup].push(accName);
        }

        if (!cloudData.coins) cloudData.coins = {};
        cloudData.coins[accName] = coin;

        saveToCloud();
    }

    function addNewAccount() {
        const acc = document.getElementById('newAccNameInput').value.trim();
        const coinVal = document.getElementById('newAccCoinInput').value.trim();
        if (!acc) {
            alert('請輸入帳號代號！');
            return;
        }
        const coin = coinVal !== '' ? Number(coinVal) : 0;

        let targetGroup = 'R少';
        if (coin < 200) targetGroup = 'R少';
        else if (coin < 300) targetGroup = 'R中';
        else targetGroup = 'R多';

        let exists = false;
        ['R少', 'R中', 'R多'].forEach(g => {
            if (cloudData.groups[g] && cloudData.groups[g].includes(acc)) exists = true;
        });

        if (exists) {
            alert(`帳號【${acc}】已經存在囉！`);
            return;
        }

        if (!cloudData.groups[targetGroup]) cloudData.groups[targetGroup] = [];
        cloudData.groups[targetGroup].push(acc);

        if (!cloudData.coins) cloudData.coins = {};
        cloudData.coins[acc] = coin;

        document.getElementById('newAccNameInput').value = '';
        document.getElementById('newAccCoinInput').value = '';
        saveToCloud();
    }

    function addDevice() {
        const val = document.getElementById('newDeviceInput').value.trim();
        if (!val) return;
        if (!cloudData.devices) cloudData.devices = [];
        cloudData.devices.push(val);
        document.getElementById('newDeviceInput').value = '';
        saveToCloud();
    }
    function removeDevice(idx) {
        cloudData.devices.splice(idx, 1);
        saveToCloud();
    }

    function addIosAccount() {
        const val = document.getElementById('newIosInput').value.trim();
        if (!val) return;
        if (!cloudData.groups['IOS']) cloudData.groups['IOS'] = [];
        cloudData.groups['IOS'].push(val);
        document.getElementById('newIosInput').value = '';
        saveToCloud();
    }
    function removeIos(idx) {
        cloudData.groups['IOS'].splice(idx, 1);
        saveToCloud();
    }

    function removeRspAcc(acc) {
        if (!confirm(`確定要刪除帳號 ${acc} 嗎？`)) return;
        ['R少', 'R中', 'R多'].forEach(g => {
            if (cloudData.groups[g]) {
                const idx = cloudData.groups[g].indexOf(acc);
                if (idx > -1) cloudData.groups[g].splice(idx, 1);
            }
        });
        if (cloudData.coins && cloudData.coins[acc] !== undefined) {
            delete cloudData.coins[acc];
        }
        saveToCloud();
    }
</script>

</body>
</html>
